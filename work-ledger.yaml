    acceptance:
      - ProseMirror 支持中文输入、段落、选择与复制粘贴、撤销重做、标题修改，支持内容的 Markdown 往返一致。
      - 保存按钮与 Ctrl+S 可用，显示修改和保存状态；切章、切书、关闭有保存、放弃、取消，失败保留编辑内容。
